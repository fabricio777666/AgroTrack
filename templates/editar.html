{% extends 'base.html' %}

{% block title %}AgroTrack — Editar Máquina{% endblock %}

{% block content %}
<h1>Editar Maquinário</h1>

<form method="POST" class="form-cadastro">
    <label for="nome">Nome da máquina</label>
    <input type="text" id="nome" name="nome" value="{{ maquina.nome }}" required>

    <label for="tipo">Tipo</label>
    <select id="tipo" name="tipo" required>
        {% for opcao in ["Trator", "Colheitadeira", "Pulverizador", "Outro"] %}
        <option value="{{ opcao }}" {% if maquina.tipo == opcao %}selected{% endif %}>{{ opcao }}</option>
        {% endfor %}
    </select>

    <label for="horimetro_atual">Horímetro atual (horas)</label>
    <input type="number" step="0.1" id="horimetro_atual" name="horimetro_atual" value="{{ maquina.horimetro_atual }}" required>

    <label for="consumo_diesel_litros_hora">Consumo de diesel (litros/hora)</label>
    <input type="number" step="0.1" id="consumo_diesel_litros_hora" name="consumo_diesel_litros_hora" value="{{ maquina.consumo_diesel_litros_hora }}" required>

    <label for="custo_diesel_litro">Custo do diesel (R$/litro)</label>
    <input type="number" step="0.01" id="custo_diesel_litro" name="custo_diesel_litro" value="{{ maquina.custo_diesel_litro }}" required>

    <label for="ultima_manutencao_horimetro">Horímetro na última manutenção</label>
    <input type="number" step="0.1" id="ultima_manutencao_horimetro" name="ultima_manutencao_horimetro" value="{{ maquina.ultima_manutencao_horimetro }}" required>

    <label for="intervalo_manutencao_horas">Intervalo entre manutenções (horas)</label>
    <input type="number" step="1" id="intervalo_manutencao_horas" name="intervalo_manutencao_horas" value="{{ maquina.intervalo_manutencao_horas }}" required>

    <button type="submit">Salvar alterações</button>
</form>
{% endblock %}
