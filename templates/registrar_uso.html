<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Registrar Uso</title>
</head>
<body>

    <h1>Registrar Uso da Máquina</h1>

    <form method="POST" action="/registrar">

        <label for="data">Data:</label>
        <input type="date" id="data" name="data" required>

        <br><br>

        <label for="horas">Horas que a máquina rodou:</label>
        <input type="number" id="horas" name="horas" step="0.1" required>

        <br><br>

        <label for="combustivel">Consumo de combustível (litros):</label>
        <input type="number" id="combustivel" name="combustivel" step="0.1" required>

        <br><br>

        <button type="submit">Registrar</button>

    </form>

</body>
</html>
