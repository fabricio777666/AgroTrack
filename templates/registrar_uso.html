<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Registrar Uso</title>
</head>
<body>

    <h1>Registrar uso da máquina</h1>

    <form method="POST" action="/registrar">

        <label for="maquina">Máquina:</label>
        <input type="text" id="maquina" name="maquina" placeholder="Ex.: Trator X" required>

        <br><br>

        <label for="data">Data:</label>
        <input type="date" id="data" name="data" required>

        <br><br>

        <label for="horas">Horas trabalhadas:</label>
        <input type="number" id="horas" name="horas" step="0.1" placeholder="Ex.: 8" required>

        <br><br>

        <label for="combustivel">Combustível gasto (litros):</label>
        <input type="number" id="combustivel" name="combustivel" step="0.1" placeholder="Ex.: 50" required>

        <br><br>

        <button type="submit">Registrar Uso</button>

    </form>

</body>
</html>
